# Back-end servers, workers and language runtimes: what does the work.
# Licensed CC0-1.0 (see packs/LICENSE). Generic runtimes use priority 10 so any
# framework signature wins over them. Signatures that recognise a program mostly by
# its parent (ASP.NET Core under dotnet, Go under go or air) use 20, so a framework
# that recognises the program itself wins. A framework named only by a declared
# dependency is a guess, so those blocks say `probably`.

[[signature]]
id = "nestjs"
name = "NestJS"
role = "work"
kind = "dev_server"
default_port = 3000
http = true
priority = 40
[[signature.when]]
argv_basename = ["nest"]
[[signature.when]]
exe = ["node", "bun"]
package = ["@nestjs/core"]
probably = true
[signature.texts]
beginner = "This is your app's server program, built with NestJS. It answers requests from your website or app."
builder = "NestJS server (nest start). Default port 3000."
expert = "NestJS application on Node.js; the port is set by app.listen() in main.ts, often from PORT."
[[signature.fixture]]
exe = "node"
argv = ["node", "/work/shop/apps/api/node_modules/.bin/nest", "start", "--watch"]
[[signature.fixture]]
exe = "node"
argv = ["node", "dist/main.js"]
packages = ["@nestjs/core", "express"]

