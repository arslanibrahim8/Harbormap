id = "syn"
name = "syn"
category = "build"
crates = ["syn", "quote", "proc-macro2"]
en.beginner = "tools that let Rust code read and write other Rust code, used to build code-generating macros."
en.builder = "the core crates for Rust procedural macros: syn parses Rust syntax, quote generates tokens and proc-macro2 wraps them."
tr.beginner = "Rust kodunun başka Rust kodu okuyup yazmasını sağlayan araçlar; kod üreten makrolar için kullanılır."
tr.builder = "Rust makroları için temel kütüphaneler: syn Rust sözdizimini ayrıştırır, quote kod üretir, proc-macro2 belirteçleri sarar."
