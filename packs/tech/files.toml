[[tech]]
id = "docker-compose"
name = "Docker Compose"
category = "deploy"
en.beginner = "a tool that starts several containers for your project from one file."
en.builder = "a Docker CLI plugin that defines and runs multi-container apps from a YAML file."
tr.beginner = "projenizi tek bir dosyadan birden çok konteynerle başlatan bir araç."
tr.builder = "birden çok konteynerli uygulamayı YAML dosyasıyla tanımlayıp çalıştıran bir Docker CLI eklentisi."

[[tech]]
id = "nginx"
name = "nginx"
category = "deploy"
en.beginner = "a web server that serves your site and passes requests to your app."
en.builder = "a high-performance HTTP server and reverse proxy, configured with nginx.conf files."
tr.beginner = "sitenizi sunan ve istekleri uygulamanıza ileten bir web sunucusu."
tr.builder = "yüksek performanslı bir HTTP sunucusu ve ters vekil sunucu; ayarları nginx.conf dosyasında tutulur."

[[tech]]
id = "caddy"
name = "Caddy"
category = "deploy"
en.beginner = "a web server that gets and renews HTTPS certificates for your site automatically."
en.builder = "a Go web server with automatic HTTPS, configured with a Caddyfile."
tr.beginner = "sitenizin HTTPS sertifikalarını kendiliğinden alıp yenileyen bir web sunucusu."
tr.builder = "otomatik HTTPS özellikli, Go ile yazılmış bir web sunucusu; ayarları Caddyfile dosyasında yapılır."

[[tech]]
id = "golangci-lint"
name = "golangci-lint"
category = "build"
en.beginner = "a tool that checks your Go code for bugs and style problems at once."
en.builder = "a Go linter that runs many linters in parallel and reads a .golangci.yml file."
tr.beginner = "Go kodunuzdaki hataları ve stil sorunlarını tek seferde denetleyen bir araç."
tr.builder = "birden çok linter aracını paralel çalıştıran bir Go kod denetleme aracı; ayarları .golangci.yml dosyasından okur."

[[tech]]
id = "sqlc"
name = "sqlc"
category = "data"
en.beginner = "a tool that turns your plain SQL queries into safe Go code."
en.builder = "a code generator that compiles SQL queries into type-safe Go, configured by sqlc.yaml."
tr.beginner = "yazdığınız SQL sorgularını güvenli Go koduna çeviren bir araç."
tr.builder = "SQL sorgularından tip güvenli Go kodu üreten bir kod üreticisi; ayarları sqlc.yaml dosyasında tutulur."

[[tech]]
id = "buf"
name = "Buf"
category = "build"
en.beginner = "a tool that checks your protobuf files and generates code from them."
en.builder = "a CLI for linting, breaking-change checks and code generation for Protocol Buffers, configured by buf.yaml."
tr.beginner = "protobuf dosyalarınızı denetleyip bu dosyalardan kod üreten bir araç."
tr.builder = "Protocol Buffers şemaları için denetim, kırıcı değişiklik kontrolü ve kod üretimi yapan bir komut satırı aracı; ayarları buf.yaml dosyasındadır."

[[tech]]
id = "mariadb"
name = "MariaDB"
category = "data"
en.beginner = "a free database server that stores your app's data, compatible with MySQL."
en.builder = "an open-source relational database server forked from MySQL and compatible with its clients."
tr.beginner = "uygulamanızın verilerini tutan, MySQL ile uyumlu ücretsiz bir veritabanı sunucusu."
tr.builder = "MySQL'den türetilmiş, açık kaynaklı bir ilişkisel veritabanı sunucusu; MySQL istemcileriyle çalışır."

[[tech]]
id = "memcached"
name = "Memcached"
category = "data"
en.beginner = "a fast memory cache that keeps often-used data ready so pages load quicker."
en.builder = "a distributed in-memory key-value cache server with a simple text protocol."
tr.beginner = "sık kullanılan verileri hazırda tutarak sayfaların daha hızlı açılmasını sağlayan bir bellek önbelleği."
tr.builder = "bellekte anahtar-değer çiftlerini tutan, dağıtık çalışabilen basit bir önbellek sunucusu."

[[tech]]
id = "valkey"
name = "Valkey"
category = "data"
en.beginner = "a fast in-memory store, compatible with Redis, for caches and quick data."
en.builder = "an open-source key-value data server forked from Redis, under the Linux Foundation, with Redis-compatible commands."
tr.beginner = "Redis ile uyumlu, önbellek ve hızlı veri erişimi için kullanılan bellek içi bir veri deposu."
tr.builder = "Redis'ten türetilmiş, açık kaynaklı bir anahtar-değer sunucusu; Linux Foundation bünyesinde geliştirilir."

[[tech]]
id = "traefik"
name = "Traefik"
category = "deploy"
en.beginner = "a proxy that finds your running services and routes web traffic to them automatically."
en.builder = "a cloud-native reverse proxy and load balancer that reads routing rules from Docker labels or config."
tr.beginner = "çalışan servislerinizi bulup web trafiğini onlara otomatik yönlendiren bir vekil sunucu."
tr.builder = "bulut ortamları için ters vekil sunucu ve yük dengeleyici; yönlendirme kurallarını Docker etiketlerinden veya dosyadan okur."

[[tech]]
id = "apache-httpd"
name = "Apache HTTP Server"
category = "deploy"
en.beginner = "a veteran web server that has been serving websites since the 1990s."
en.builder = "the Apache HTTP Server, a modular web server configured through httpd.conf and .htaccess files."
tr.beginner = "1990'lardan beri web sitelerini sunan, köklü bir web sunucusu."
tr.builder = "modüler yapıda bir web sunucusu; ayarları httpd.conf ve .htaccess dosyalarından okur."

[[tech]]
id = "alpine"
name = "Alpine Linux"
category = "deploy"
en.beginner = "a very small Linux system often used as the base of Docker images."
en.builder = "a minimal Linux distribution built on musl libc and BusyBox, popular as a Docker base image."
tr.beginner = "Docker imajlarının temeli olarak sıkça kullanılan çok küçük bir Linux sistemi."
tr.builder = "musl libc ve BusyBox üzerine kurulu, minimal bir Linux dağıtımı; Docker temel imajı olarak yaygın kullanılır."

[[tech]]
id = "debian"
name = "Debian"
category = "deploy"
en.beginner = "a stable Linux system, a common base for Docker images and servers."
en.builder = "a community Linux distribution using the apt package manager; its slim images are common Docker bases."
tr.beginner = "kararlı bir Linux sistemi; Docker imajları ve sunucular için yaygın bir temel."
tr.builder = "apt paket yöneticisini kullanan, topluluk tarafından geliştirilen bir Linux dağıtımı; hafif imajları Docker için yaygındır."

[[tech]]
id = "ubuntu"
name = "Ubuntu"
category = "deploy"
en.beginner = "a widely used Linux system that many servers and Docker images are built on."
en.builder = "a Debian-based Linux distribution by Canonical, with the apt package manager and LTS releases."
tr.beginner = "birçok sunucuda ve Docker imajında kullanılan yaygın bir Linux sistemi."
tr.builder = "Canonical şirketinin Debian tabanlı Linux dağıtımı; apt paket yöneticisini ve uzun süre destekli sürümleri içerir."

[[tech]]
id = "mailpit"
name = "Mailpit"
category = "testing"
en.beginner = "a fake mail server that catches the emails your app sends during development."
en.builder = "a local SMTP test server with a web interface and API that stores captured emails."
tr.beginner = "geliştirme sırasında uygulamanızın gönderdiği e-postaları yakalayan sahte bir posta sunucusu."
tr.builder = "SMTP ile çalışan yerel bir test sunucusu; yakalanan e-postaları web arayüzünde ve API üzerinden gösterir."

[[tech]]
id = "localstack"
name = "LocalStack"
category = "deploy"
en.beginner = "a tool that runs local copies of cloud services such as AWS on your own computer."
en.builder = "an emulator for AWS APIs in a Docker container, so apps can test cloud calls offline."
tr.beginner = "AWS gibi bulut hizmetlerinin yerel kopyalarını kendi bilgisayarınızda çalıştıran bir araç."
tr.builder = "AWS API'lerini Docker konteynerinde taklit eden bir araç; uygulamalar bulut çağrılarını internet olmadan test edebilir."

[[tech]]
id = "adminer"
name = "Adminer"
category = "data"
en.beginner = "a small web page for browsing and editing the tables of your database."
en.builder = "a single-file PHP tool for managing MySQL, PostgreSQL, SQLite and other databases in a browser."
tr.beginner = "veritabanınızın tablolarını tarayıcıdan görüntülemenizi ve düzenlemenizi sağlayan küçük bir web sayfası."
tr.builder = "tek dosyalık PHP aracı; MySQL, PostgreSQL, SQLite ve diğer veritabanlarını tarayıcıda yönetir."

[[tech]]
id = "pgadmin"
name = "pgAdmin"
category = "data"
en.beginner = "a web-based control panel for managing your PostgreSQL databases."
en.builder = "an open-source web administration tool for PostgreSQL, with a query tool and schema browser."
tr.beginner = "PostgreSQL veritabanlarınızı yönetmek için web tabanlı bir kontrol paneli."
tr.builder = "PostgreSQL için açık kaynaklı bir web yönetim aracı; sorgu aracı ve şema tarayıcısı içerir."

[[tech]]
id = "grafana"
name = "Grafana"
category = "deploy"
en.beginner = "a dashboard tool that draws charts from your app's metrics and logs."
en.builder = "an open-source visualization and alerting platform that queries data sources like Prometheus."
tr.beginner = "uygulamanızın ölçümlerinden ve günlüklerinden grafik çizen bir gösterge paneli aracı."
tr.builder = "Prometheus gibi veri kaynaklarını sorgulayıp grafik ve uyarı üreten açık kaynaklı bir izleme platformu."

[[tech]]
id = "jaeger"
name = "Jaeger"
category = "deploy"
en.beginner = "a tool that traces one request as it moves through your services, to find slow steps."
en.builder = "an open-source distributed tracing system that collects and shows OpenTelemetry-compatible spans."
tr.beginner = "bir isteğin servisler arasındaki yolculuğunu izleyip yavaş adımları bulmanıza yardımcı olan bir araç."
tr.builder = "dağıtık izleme sistemi; OpenTelemetry ile uyumlu izleri toplayıp gösterir."

[[tech]]
id = "clickhouse"
name = "ClickHouse"
category = "data"
en.beginner = "a database built for fast analysis of very large amounts of data."
en.builder = "a column-oriented SQL analytics database management system for large-scale queries."
tr.beginner = "çok büyük veri kümelerinde hızlı analiz yapmak için geliştirilmiş bir veritabanı."
tr.builder = "sütun tabanlı, SQL ile sorgulanan bir analitik veritabanı yönetim sistemi; büyük veri sorguları için tasarlanmıştır."

[[tech]]
id = "cassandra"
name = "Apache Cassandra"
category = "data"
en.beginner = "a database that spreads data across many servers and stays online if some fail."
en.builder = "a distributed wide-column NoSQL database with tunable consistency and no single point of failure."
tr.beginner = "verileri birçok sunucuya dağıtan, bazı sunucular çökse bile çalışmaya devam eden bir veritabanı."
tr.builder = "geniş sütunlu, dağıtık bir NoSQL veritabanı; tutarlılık düzeyi ayarlanabilir ve tek hata noktası yoktur."

[[tech]]
id = "neo4j"
name = "Neo4j"
category = "data"
en.beginner = "a database that stores data as connected nodes, good for relationships like friends or links."
en.builder = "a graph database that stores nodes and relationships, queried with the Cypher language."
tr.beginner = "verileri birbirine bağlı düğümler olarak tutan bir veritabanı; arkadaşlık gibi ilişkiler için uygundur."
tr.builder = "düğümler ve ilişkilerden oluşan bir graf veritabanı; sorgular Cypher dilinde yazılır."

[[tech]]
id = "opensearch"
name = "OpenSearch"
category = "data"
en.beginner = "a search engine that finds text in your data quickly, like a site's search box."
en.builder = "an open-source search and analytics engine forked from Elasticsearch, with a REST API."
tr.beginner = "verileriniz içinde metni hızla bulan bir arama motoru; site aramaları gibi."
tr.builder = "Elasticsearch'ten türetilmiş, açık kaynaklı bir arama ve analiz motoru; REST API sunar."

[[tech]]
id = "keycloak"
name = "Keycloak"
category = "auth"
maven = ["org.keycloak:*"]
en.beginner = "a login server that handles sign-in, user accounts and single sign-on for your apps."
en.builder = "an open-source identity and access management server supporting OAuth 2.0, OpenID Connect and SAML."
tr.beginner = "uygulamalarınız için oturum açma, kullanıcı hesapları ve tek oturum açma işlerini yürüten bir sunucu."
tr.builder = "açık kaynaklı bir kimlik ve erişim yönetimi sunucusu; OAuth 2.0, OpenID Connect ve SAML destekler."

