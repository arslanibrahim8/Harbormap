<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Harbormap Learn</title>
    <link rel="stylesheet" href="/assets/app.css" />
  </head>
  <body>
    <div id="app">
      <header id="topbar"></header>
      <aside id="sidebar"></aside>
      <main id="main">
        <nav id="tabs"></nav>
        <div id="notice" role="status" hidden></div>
        <section id="pane-journeys" class="pane" hidden></section>
        <section id="pane-map" class="pane">
          <div id="tech-strip" hidden></div>
          <div id="map"></div>
        </section>
        <section id="pane-code" class="pane" hidden></section>
      </main>
      <aside id="drawer" hidden></aside>
    </div>
    <script src="/assets/app.js"></script>
  </body>
</html>
