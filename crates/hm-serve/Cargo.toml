[package]
name = "hm-serve"
description = "Harbormap Learn panel server: local HTTP with a per-run token, JSON views and live events"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
axum.workspace = true
dunce.workspace = true
getrandom.workspace = true
hm-core.workspace = true
hm-index.workspace = true
hm-layout.workspace = true
hm-project.workspace = true
hm-store.workspace = true
# `debug-embed`: debug and release builds serve the same embedded bytes.
rust-embed = { workspace = true, features = ["debug-embed"] }
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "net", "sync", "macros", "signal", "time"] }
tokio-stream.workspace = true
tower-http.workspace = true

[dev-dependencies]
flate2.workspace = true
tempfile.workspace = true
ureq.workspace = true

[lints]
workspace = true
