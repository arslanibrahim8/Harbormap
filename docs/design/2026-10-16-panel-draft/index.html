<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Harbormap · shop</title>
<style>
:root{
  --bg:#09090B; --bg2:#0E0E11; --panel:#131317; --panel2:#18181D; --line:#24242B; --line2:#2F2F38;
  --ink:#F2F2F3; --sub:#A1A1AA; --dim:#6B6B75;
  --red:#F43F4E; --red2:#B91C2C; --redbg:rgba(244,63,78,.10); --redbd:rgba(244,63,78,.38);
  --ok:#E4E4E7; --okdot:#4ADE80;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,ui-sans-serif,system-ui,sans-serif;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:14px/1.45 var(--sans);-webkit-font-smoothing:antialiased;overflow:hidden}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
.app{display:grid;grid-template-columns:224px 1fr 320px;grid-template-rows:56px 1fr;height:100vh}

/* top bar */
.top{grid-column:1/-1;display:flex;align-items:center;gap:16px;padding:0 16px;border-bottom:1px solid var(--line);background:var(--bg2)}
.brand{display:flex;align-items:center;gap:10px;font-weight:650;letter-spacing:.2px;width:216px}
.logo{width:22px;height:22px;border-radius:6px;background:linear-gradient(135deg,var(--red),var(--red2));box-shadow:0 0 18px rgba(244,63,78,.45)}
.search{flex:1;max-width:460px;display:flex;align-items:center;gap:8px;height:34px;padding:0 12px;border:1px solid var(--line);border-radius:9px;background:var(--panel)}
.search input{flex:1;background:none;border:0;outline:0;color:var(--ink);font:inherit}
.search kbd{font:11px var(--mono);color:var(--dim);border:1px solid var(--line2);border-radius:4px;padding:1px 5px}
.seg{display:flex;padding:3px;border:1px solid var(--line);border-radius:9px;background:var(--panel)}
.seg button{padding:5px 12px;border-radius:6px;color:var(--sub);font-size:13px}
.seg button.on{background:var(--panel2);color:var(--ink);box-shadow:inset 0 0 0 1px var(--line2)}
.live{margin-left:auto;display:flex;align-items:center;gap:8px;color:var(--sub);font-size:12px}
.live i{width:7px;height:7px;border-radius:50%;background:var(--red);box-shadow:0 0 0 0 rgba(244,63,78,.6);animation:pulse 2s infinite}
@keyframes pulse{70%{box-shadow:0 0 0 7px rgba(244,63,78,0)}100%{box-shadow:0 0 0 0 rgba(244,63,78,0)}}

/* sidebar */
.side{border-right:1px solid var(--line);background:var(--bg2);overflow:auto;padding:14px 10px}
.sec{margin-bottom:18px}
.sec h4{margin:0 8px 6px;font:600 11px var(--sans);letter-spacing:.9px;text-transform:uppercase;color:var(--dim)}
.item{display:flex;align-items:center;gap:9px;width:100%;padding:7px 8px;border-radius:7px;text-align:left;color:var(--sub)}
.item:hover{background:var(--panel)}
.item.on{background:var(--panel2);color:var(--ink);box-shadow:inset 2px 0 0 var(--red)}
.item .n{margin-left:auto;font:12px var(--mono);color:var(--dim)}
.item .t{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dot{width:7px;height:7px;border-radius:50%;background:var(--okdot);flex:none}
.dot.bad{background:var(--red)}
.dot.off{background:var(--dim)}
.port{font:12px var(--mono);color:var(--sub)}

/* centre */
.main{position:relative;overflow:hidden;background:
  radial-gradient(1200px 600px at 70% -10%,rgba(244,63,78,.07),transparent 60%),var(--bg)}
.tabs{position:absolute;z-index:3;top:14px;left:16px;right:16px;display:flex;align-items:center;gap:10px}
.tabs .title{font-weight:650;font-size:16px;margin-right:6px}
.tabs .meta{color:var(--dim);font-size:12px}
.tabs .seg{margin-left:auto}
.view{position:absolute;inset:0;padding-top:60px;transition:opacity .18s ease}
.view.hide{opacity:0;pointer-events:none}

/* map */
.stage{position:absolute;inset:60px 0 0 0;cursor:grab}
.stage.drag{cursor:grabbing}
.world{position:absolute;left:0;top:0;width:1100px;height:660px;transform-origin:0 0;will-change:transform}
.lane{position:absolute;top:0;height:660px;border-left:1px dashed var(--line)}
.lane span{position:absolute;top:6px;left:12px;white-space:nowrap;font:600 10.5px var(--sans);letter-spacing:1.1px;color:var(--dim);text-transform:uppercase}
svg.edges{position:absolute;left:0;top:0;overflow:visible;pointer-events:none}
.edge{fill:none;stroke:#3A3A44;stroke-width:1.6;stroke-dasharray:5 5;transition:stroke .15s}
.edge.hot{stroke:var(--red);stroke-dasharray:none;animation:none}
.edge.flow{animation:flow 1.2s linear infinite}
@keyframes flow{to{stroke-dashoffset:-20}}
.elabel{font:11px var(--mono);fill:#8A8A93;paint-order:stroke;stroke:#09090B;stroke-width:4px}
.elabel.hot{fill:var(--red)}
.node{position:absolute;width:210px;padding:12px 14px 12px 26px;border:1px solid var(--line2);border-radius:12px;background:var(--panel);
  box-shadow:0 18px 40px -28px #000;transition:border-color .15s,transform .15s,opacity .15s;cursor:pointer}
.node:hover{border-color:#4A4A55;transform:translateY(-1px)}
.node.sel{border-color:var(--red);box-shadow:0 0 0 3px var(--redbg),0 18px 40px -28px #000}
.node.fade{opacity:.28}
.node.bad{border-color:var(--redbd)}
.node .hd{display:flex;flex-wrap:wrap;align-items:baseline;column-gap:6px}
.node b{white-space:nowrap}
.node .fw{white-space:nowrap}
.node b{font-size:15px}
.node .fw{color:var(--sub);font-size:12.5px}
.node p{margin:5px 0 8px;color:var(--sub);font-size:12.5px}
.chip{display:inline-flex;align-items:center;gap:6px;height:22px;padding:0 8px;border-radius:6px;background:var(--panel2);border:1px solid var(--line);font-size:11.5px;color:var(--sub)}
.chip.bad{background:var(--redbg);border-color:var(--redbd);color:#FFB3BA}
.tab{position:absolute;left:-1px;top:17px;transform:translateX(-50%);height:22px;padding:0 7px;border-radius:6px;background:var(--red2);color:#fff;font:600 11px/22px var(--mono)}
.tab.idle{background:var(--panel2);color:var(--sub);border:1px dashed var(--line2);line-height:20px}
.node.people{width:150px;text-align:center;padding-left:14px}
.zoom{position:absolute;right:16px;bottom:16px;display:flex;flex-direction:column;border:1px solid var(--line);border-radius:9px;background:var(--panel);overflow:hidden;z-index:3}
.zoom button{width:34px;height:32px;color:var(--sub)}
.zoom button:hover{background:var(--panel2);color:var(--ink)}
.legend{position:absolute;left:16px;bottom:16px;display:flex;gap:14px;font-size:11.5px;color:var(--dim);z-index:3;flex-wrap:wrap}
.legend span{display:flex;align-items:center;gap:6px}
.sw{width:18px;height:0;border-top:1.6px dashed #55555F}

/* branches */
.branches{position:absolute;inset:60px 0 0 0;overflow:auto;padding:4px 16px 24px}
.summary{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:14px}
.stat{padding:12px 14px;border:1px solid var(--line);border-radius:11px;background:var(--panel)}
.stat b{display:block;font-size:22px;font-weight:650}
.stat span{color:var(--dim);font-size:12px}
.stat.red b{color:var(--red)}
.bcard{display:grid;grid-template-columns:220px 1fr 210px;gap:16px;align-items:center;padding:14px 16px;margin-bottom:8px;border:1px solid var(--line);border-radius:11px;background:var(--panel);cursor:pointer;transition:border-color .15s}
.bcard:hover{border-color:var(--line2)}
.bcard.sel{border-color:var(--red)}
.bname{font:600 13.5px var(--mono)}
.bsub{color:var(--dim);font-size:12px;margin-top:3px}
.lanes svg{display:block;width:100%;height:44px}
.bright{display:flex;flex-wrap:wrap;gap:6px;justify-content:flex-end}
.ahead{color:var(--ink)}.behind{color:var(--dim)}
.timeline{margin-top:18px;padding:14px 16px;border:1px solid var(--line);border-radius:11px;background:var(--panel)}
.timeline h3,.drawer h3{margin:0 0 10px;font-size:13px;font-weight:650}
.tl{display:grid;grid-template-columns:70px 14px 1fr;gap:0 10px;font-size:12.5px}
.tl .d{color:var(--dim);font:12px var(--mono);padding:6px 0}
.tl .r{position:relative}
.tl .r::before{content:"";position:absolute;left:6px;top:0;bottom:0;width:1.5px;background:var(--line2)}
.tl .r::after{content:"";position:absolute;left:2px;top:11px;width:10px;height:10px;border-radius:50%;background:var(--bg);border:2px solid var(--red)}
.tl .x{padding:6px 0;color:var(--sub)}
.tl .x b{color:var(--ink);font-weight:600}

/* drawer */
.drawer{border-left:1px solid var(--line);background:var(--bg2);overflow:auto;padding:18px 18px 24px}
.kicker{font:600 11px var(--sans);letter-spacing:.9px;text-transform:uppercase;color:var(--red);margin-bottom:6px}
.drawer h2{margin:0 0 4px;font-size:20px}
.drawer .lead{color:var(--sub);margin:0 0 14px}
.facts{border-top:1px solid var(--line);margin:14px 0}
.fact{display:flex;justify-content:space-between;gap:12px;padding:9px 0;border-bottom:1px solid var(--line);font-size:13px}
.fact span{color:var(--dim)}
.fact code{font:12.5px var(--mono);color:var(--ink);text-align:right;word-break:break-all}
.btn{display:inline-flex;align-items:center;justify-content:center;height:36px;padding:0 14px;border-radius:9px;font-weight:600;font-size:13px}
.btn.pri{background:var(--red);color:#fff}
.btn.pri:hover{background:#FF5562}
.btn.ghost{border:1px solid var(--line2);color:var(--sub)}
.btn.ghost:hover{color:var(--ink);border-color:#4A4A55}
.actions{display:flex;gap:8px;flex-wrap:wrap}
.story{counter-reset:s;margin:0;padding:0;list-style:none}
.story li{position:relative;padding:0 0 14px 30px;color:var(--sub)}
.story li::before{counter-increment:s;content:counter(s);position:absolute;left:0;top:0;width:20px;height:20px;border-radius:6px;background:var(--panel2);border:1px solid var(--line2);font:600 11px/18px var(--mono);text-align:center;color:var(--ink)}
.story li b{display:block;color:var(--ink);font-weight:600}
.alert{padding:12px 14px;border:1px solid var(--redbd);background:var(--redbg);border-radius:11px;margin:4px 0 16px}
.alert b{color:#FFC2C8}
.alert p{margin:4px 0 10px;color:#E8B7BC;font-size:13px}
.note{color:var(--dim);font-size:11.5px;margin-top:20px}
/* code */
.code{position:absolute;inset:60px 0 0 0;overflow:auto;padding:4px 16px 24px}
.svcbar{display:flex;align-items:center;gap:8px;margin-bottom:12px;flex-wrap:wrap}
.svcbar .chip{cursor:pointer;height:28px;padding:0 11px;font-size:12.5px}
.svcbar .chip.on{color:var(--ink);border-color:var(--red);background:var(--redbg)}
.svcbar .hint{margin-left:auto;color:var(--dim);font-size:12px}
.cwrap{position:relative}
.cgrid{position:relative;z-index:1;display:grid;grid-template-columns:repeat(4,minmax(150px,1fr));gap:64px;align-items:start}
svg.cedges{position:absolute;inset:0;width:100%;height:100%;z-index:0;overflow:visible;pointer-events:none}
.gcard{border:1px solid var(--line2);border-radius:12px;background:var(--panel);overflow:hidden}
.gcard:nth-child(2){margin-top:38px}.gcard:nth-child(3){margin-top:12px}.gcard:nth-child(4){margin-top:52px}
.ghd{padding:10px 12px 8px;border-bottom:1px solid var(--line)}
.ghd b{font:600 13px var(--mono)}
.ghd span{display:block;color:var(--dim);font-size:11.5px;margin-top:2px}
.frow{display:flex;align-items:center;gap:8px;padding:7px 12px;cursor:pointer;font:12.5px var(--mono);color:var(--sub);border-bottom:1px solid #1C1C22;transition:background .12s,color .12s,opacity .12s}
.frow:last-child{border-bottom:0}
.frow:hover{background:var(--panel2);color:var(--ink)}
.frow.sel{background:var(--redbg);color:var(--ink);box-shadow:inset 2px 0 0 var(--red)}
.frow.near{color:var(--ink)}
.frow.fade{opacity:.32}
.frow .k{margin-left:auto;font-size:10.5px;color:var(--dim)}
.gedge{fill:none;stroke:#34343D;stroke-linecap:round}
.gcount{font:10.5px var(--mono);fill:#8A8A93;paint-order:stroke;stroke:#09090B;stroke-width:4px}
.fedge{fill:none;stroke:var(--red);stroke-width:1.6}
.fedge.in{stroke:#A1A1AA;stroke-dasharray:4 4}
.clegend{display:flex;gap:16px;margin-top:16px;color:var(--dim);font-size:11.5px;flex-wrap:wrap}
.clegend span{display:flex;align-items:center;gap:6px}
.pills{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 4px}
.pill{display:inline-flex;align-items:center;gap:6px;padding:4px 9px;border-radius:999px;background:var(--panel2);border:1px solid var(--line2);font-size:12px;color:var(--ink)}
.pill i{font-style:normal;font:10px var(--mono);color:var(--dim)}
.drawer h3{margin:18px 0 6px;font-size:12px;letter-spacing:.8px;text-transform:uppercase;color:var(--dim)}
.fn{display:flex;justify-content:space-between;gap:10px;padding:7px 0;border-bottom:1px solid var(--line);font-size:12.5px}
.fn code{font:12.5px var(--mono);color:var(--ink)}.fn span{color:var(--sub);text-align:right}
.fit{padding:10px 12px;border:1px solid var(--line2);border-radius:10px;background:var(--panel);color:var(--sub);font-size:13px}
.fit b{color:var(--ink)}
.ev{font:10.5px var(--mono);color:var(--dim)}
::-webkit-scrollbar{width:10px;height:10px}::-webkit-scrollbar-thumb{background:#24242B;border-radius:10px;border:3px solid var(--bg2)}
</style>
</head>

    <div class="brand"><div class="logo"></div>Harbormap</div>
    <label class="search">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#6B6B75" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>

function drawEdges(){

}

function laneSvg(b){
  if(b.main) return `<svg viewBox="0 0 300 44" preserveAspectRatio="none"><line x1="0" y1="22" x2="300" y2="22" stroke="#F43F4E" stroke-width="2"/>${[...Array(12)].map((_,i)=>`<circle cx="${12+i*25}" cy="22" r="3" fill="#F43F4E"/>`).join('')}</svg>`;
  const base=120, a=Math.min(b.ahead,8), be=Math.min(b.behind,8);
  let s=`<line x1="0" y1="32" x2="300" y2="32" stroke="#3A3A44" stroke-width="2"/>`;
  for(let i=0;i<be;i++) s+=`<circle cx="${base+20+i*20}" cy="32" r="2.6" fill="#55555F"/>`;
  if(b.merged){ s+=`<path d="M60,32 C80,10 120,10 140,10 L180,10 C200,10 210,32 230,32" fill="none" stroke="#A1A1AA" stroke-width="1.6"/><circle cx="160" cy="10" r="3" fill="#A1A1AA"/><circle cx="230" cy="32" r="4.5" fill="none" stroke="#F43F4E" stroke-width="2"/>`; return `<svg viewBox="0 0 300 44" preserveAspectRatio="none">${s}</svg>`}
  s+=`<path d="M${base},32 C${base+12},12 ${base+20},10 ${base+30},10 L${base+30+a*18},10" fill="none" stroke="${b.stale?'#6B6B75':'#F43F4E'}" stroke-width="2"/>`;
  for(let i=0;i<a;i++) s+=`<circle cx="${base+36+i*18}" cy="10" r="3" fill="${b.stale?'#6B6B75':'#F43F4E'}"/>`;
  s+=`<circle cx="${base}" cy="32" r="3.5" fill="#09090B" stroke="#A1A1AA" stroke-width="1.6"/>`;
  return `<svg viewBox="0 0 300 44" preserveAspectRatio="none">${s}</svg>`;
}

function drawCodeEdges(){

  const W=svg.getBoundingClientRect(); const rel=el=>{const r=el.getBoundingClientRect();return {l:r.left-W.left,r:r.right-W.left,t:r.top-W.top,b:r.bottom-W.top,m:(r.top+r.bottom)/2-W.top}};
  let s='';
  if(sel&&sel.startsWith('f:')){
    const f=sel.slice(2), me=rel($(`.frow[data-file="${f}"]`));

      const other=a===f?b:a, o=rel($(`.frow[data-file="${other}"]`)), out=a===f;
      if(FILES[a].g===FILES[b].g){ // same folder: a small loop on the right edge
        const x=me.r, y1=me.m, y2=o.m, bend=x+26; s+=`<path class="fedge ${out?'':'in'}" d="M${x},${y1} C${bend},${y1} ${bend},${y2} ${x},${y2}"/>`; continue;}
      const [A,B]=me.l<o.l?[me,o]:[o,me], x1=A.r,x2=B.l,mx=(x1+x2)/2;
      s+=`<path class="fedge ${out?'':'in'}" d="M${x1},${A.m} C${mx},${A.m} ${mx},${B.m} ${x2},${B.m}"/>`;
    }
  } else {
    const agg={}; IMPORTS.forEach(([a,b])=>{const ga=FILES[a].g,gb=FILES[b].g;if(ga!==gb){const k=ga+'>'+gb;agg[k]=(agg[k]||0)+1}});

      const x1=A.r,x2=B.l,y1=A.m,y2=B.m,mx=(x1+x2)/2,w=Math.min(2+agg[k]*1.4,10);

  }
  svg.innerHTML=s;
}

function render(){renderSide();renderMap();renderCode();renderBranches();renderDrawer()}

// interactions
document.addEventListener('click',e=>{
  const n=e.target.closest('[data-node]'), b=e.target.closest('[data-branch]'), w=e.target.closest('[data-wt]'), go=e.target.closest('[data-go]');
  if(go){sel=go.dataset.go;render();return}
  if(w){wt=w.dataset.wt;sel=null;render();fit();return}
  if(n){sel=sel===n.dataset.node?null:n.dataset.node;render();return}
  if(b){sel=sel==='b:'+b.dataset.branch?null:'b:'+b.dataset.branch;renderBranches();renderDrawer();return}
  const fr=e.target.closest('[data-file]'); if(fr){sel=sel==='f:'+fr.dataset.file?null:'f:'+fr.dataset.file;renderCode();renderDrawer();return}
});
$('#level').addEventListener('click',e=>{const t=e.target.closest('button');if(!t)return;level=t.dataset.l;[...$('#level').children].forEach(c=>c.classList.toggle('on',c===t));render()});
$('#viewSeg').addEventListener('click',e=>{const t=e.target.closest('button');if(!t)return;view=t.dataset.v;[...$('#viewSeg').children].forEach(c=>c.classList.toggle('on',c===t));
  $('#vMap').classList.toggle('hide',view!=='map');$('#vCode').classList.toggle('hide',view!=='code');$('#vBranches').classList.toggle('hide',view!=='branches');sel=null;render()});
addEventListener('resize',()=>requestAnimationFrame(drawCodeEdges));
$('#q').addEventListener('input',e=>{const q=e.target.value.toLowerCase().trim();
  document.querySelectorAll('#world .node').forEach(el=>{const d=NODES[el.dataset.node];const hit=!q||(d.name+' '+(d.fw||'')+' '+(d.ports||[]).join(' ')).toLowerCase().includes(q);el.classList.toggle('fade',!hit)});
  document.querySelectorAll('.bcard').forEach(el=>el.style.display=!q||el.dataset.branch.toLowerCase().includes(q)?'':'none')});
addEventListener('keydown',e=>{if(e.key==='/'&&document.activeElement!==$('#q')){e.preventDefault();$('#q').focus()}if(e.key==='Escape'){sel=null;$('#q').value='';render()}});

// pan & zoom: one transform on one element, nothing else moves
let k=1,tx=0,ty=0,drag=null;const stage=$('#stage'),world=$('#world');
const apply=()=>world.style.transform=`translate(${tx}px,${ty}px) scale(${k})`;
function fit(){const r=stage.getBoundingClientRect();k=Math.min((r.width-32)/1100,(r.height-50)/660,1.2);tx=(r.width-1100*k)/2;ty=8;apply()}
stage.addEventListener('wheel',e=>{e.preventDefault();const r=stage.getBoundingClientRect(),mx=e.clientX-r.left,my=e.clientY-r.top,nk=Math.max(.4,Math.min(2.2,k*Math.exp(-e.deltaY*.0015)));tx=mx-(mx-tx)*nk/k;ty=my-(my-ty)*nk/k;k=nk;apply()},{passive:false});
stage.addEventListener('pointerdown',e=>{if(e.target.closest('.node'))return;drag={x:e.clientX-tx,y:e.clientY-ty};stage.classList.add('drag');stage.setPointerCapture(e.pointerId)});
stage.addEventListener('pointermove',e=>{if(!drag)return;tx=e.clientX-drag.x;ty=e.clientY-drag.y;apply()});
stage.addEventListener('pointerup',()=>{drag=null;stage.classList.remove('drag')});
const zoomBy=f=>{const r=stage.getBoundingClientRect(),cx=r.width/2,cy=r.height/2,nk=Math.max(.4,Math.min(2.2,k*f));tx=cx-(cx-tx)*nk/k;ty=cy-(cy-ty)*nk/k;k=nk;apply()};
$('#zin').onclick=()=>zoomBy(1.2);$('#zout').onclick=()=>zoomBy(1/1.2);$('#zfit').onclick=fit;
addEventListener('resize',fit);
render();fit();
// ?view=branches&sel=celery opens a given state (handy for sharing a screen)
const P=new URLSearchParams(location.search);
if(P.get('sel')){sel=P.get('sel');render()}
if(P.get('view')){document.querySelector(`#viewSeg [data-v=${P.get('view')}]`).click();if(P.get('sel')){sel=P.get('sel');render()}}
</script>
</body>
</html>
